<svg width="1200" height="430" viewBox="0 0 1200 430"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     aria-label="Vaibhav Patel — CSE Student, Problem Solver and Builder">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="55%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#101426"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#151c2c" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0c1220" stop-opacity="0.88"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#334155" stroke-opacity="0.16"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="430" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="430" rx="24" fill="url(#grid)"/>

  <!-- Ambient accents -->
  <circle cx="1080" cy="70" r="150" fill="#4f46e5" opacity="0.07"/>
  <circle cx="180" cy="390" r="180" fill="#06b6d4" opacity="0.045"/>

  <!-- Outer frame -->
  <rect x="18" y="18" width="1164" height="394" rx="18"
        fill="none" stroke="#334155" stroke-opacity="0.65"/>

  <!-- Terminal top bar -->
  <rect x="18" y="18" width="1164" height="48" rx="18"
        fill="#0b101b"/>

  <line x1="18" y1="66" x2="1182" y2="66"
        stroke="#334155" stroke-opacity="0.6"/>

  <circle cx="43" cy="42" r="6" fill="#64748b"/>
  <circle cx="63" cy="42" r="6" fill="#64748b"/>
  <circle cx="83" cy="42" r="6" fill="#64748b"/>

  <text x="112" y="47"
        fill="#94a3b8"
        font-family="monospace"
        font-size="14">
    vaibhav@github:~$
  </text>

  <text x="1045" y="47"
        fill="#475569"
        font-family="monospace"
        font-size="12">
    SYSTEM.ONLINE
  </text>

  <!-- Left identity panel -->
  <rect x="42" y="92" width="510" height="288" rx="16"
        fill="url(#panel)"
        stroke="#334155"
        stroke-opacity="0.8"/>

  <!-- Left panel accent -->
  <rect x="42" y="92" width="4" height="288" rx="2"
        fill="url(#accent)"
        filter="url(#glow)"/>

  <text x="70" y="124"
        fill="#64748b"
        font-family="monospace"
        font-size="12"
        letter-spacing="2">
    VISUAL.MAP
  </text>

  <!-- Abstract identity mark -->
  <g transform="translate(70 150)">
    <rect x="0" y="0" width="116" height="116" rx="14"
          fill="#0b1220"
          stroke="#334155"/>

    <text x="14" y="29"
          fill="#22d3ee"
          font-family="monospace"
          font-size="13">
      &lt;/&gt;
    </text>

    <text x="15" y="55"
          fill="#8b5cf6"
          font-family="monospace"
          font-size="12">
      JAVA
    </text>

    <text x="15" y="77"
          fill="#38bdf8"
          font-family="monospace"
          font-size="11">
      BUILD
    </text>

    <text x="15" y="98"
          fill="#64748b"
          font-family="monospace"
          font-size="10">
      ITERATE
    </text>

    <circle cx="94" cy="19" r="4" fill="#22d3ee">
      <animate attributeName="opacity"
               values="1;0.25;1"
               dur="2s"
               repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="210" y="177"
        fill="#f8fafc"
        font-family="monospace"
        font-size="29"
        font-weight="700">
    VAIBHAV PATEL
  </text>

  <text x="210" y="204"
        fill="#22d3ee"
        font-family="monospace"
        font-size="13"
        letter-spacing="1">
    CSE STUDENT
  </text>

  <text x="210" y="229"
        fill="#94a3b8"
        font-family="monospace"
        font-size="13">
    PROBLEM SOLVER
  </text>

  <text x="210" y="254"
        fill="#94a3b8"
        font-family="monospace"
        font-size="13">
    BUILDER
  </text>

  <line x1="70" y1="288" x2="520" y2="288"
        stroke="#334155"/>

  <text x="70" y="315"
        fill="#cbd5e1"
        font-family="monospace"
        font-size="13">
    Logic &gt; Luck
  </text>

  <text x="70" y="342"
        fill="#64748b"
        font-family="monospace"
        font-size="12">
    Learn → Build → Test → Improve
  </text>

  <text x="70" y="362"
        fill="#475569"
        font-family="monospace"
        font-size="10">
    Invertis University · India
  </text>

  <!-- Right system panel -->
  <rect x="575" y="92" width="583" height="288" rx="16"
        fill="url(#panel)"
        stroke="#334155"
        stroke-opacity="0.8"/>

  <text x="603" y="124"
        fill="#64748b"
        font-family="monospace"
        font-size="12"
        letter-spacing="2">
    SYSTEM.INFO
  </text>

  <text x="603" y="158"
        fill="#22d3ee"
        font-family="monospace"
        font-size="13">
    &gt; profile.load()
  </text>

  <text x="603" y="190"
        fill="#94a3b8"
        font-family="monospace"
        font-size="12">
    ROLE
  </text>

  <text x="760" y="190"
        fill="#f8fafc"
        font-family="monospace"
        font-size="12">
    CSE Student
  </text>

  <text x="603" y="218"
        fill="#94a3b8"
        font-family="monospace"
        font-size="12">
    FOCUS
  </text>

  <text x="760" y="218"
        fill="#f8fafc"
        font-family="monospace"
        font-size="12">
    Development · Problem Solving
  </text>

  <text x="603" y="246"
        fill="#94a3b8"
        font-family="monospace"
        font-size="12">
    LEARNING
  </text>

  <text x="760" y="246"
        fill="#22d3ee"
        font-family="monospace"
        font-size="12">
    Java
  </text>

  <text x="603" y="274"
        fill="#94a3b8"
        font-family="monospace"
        font-size="12">
    NEXT
  </text>

  <text x="760" y="274"
        fill="#a78bfa"
        font-family="monospace"
        font-size="12">
    Data Structures &amp; Algorithms
  </text>

  <text x="603" y="302"
        fill="#94a3b8"
        font-family="monospace"
        font-size="12">
    BUILDING
  </text>

  <text x="760" y="302"
        fill="#f8fafc"
        font-family="monospace"
        font-size="12">
    Practical Projects
  </text>

  <line x1="603" y1="326" x2="1130" y2="326"
        stroke="#334155"/>

  <!-- Project signals -->
  <text x="603" y="351"
        fill="#64748b"
        font-family="monospace"
        font-size="11">
    ACTIVE.PROJECTS
  </text>

  <text x="760" y="351"
        fill="#38bdf8"
        font-family="monospace"
        font-size="11">
    Kisan Setu · Computer Vision · IoT
  </text>

  <!-- Status -->
  <circle cx="1112" cy="350" r="4" fill="#22c55e">
    <animate attributeName="opacity"
             values="1;0.35;1"
             dur="2.4s"
             repeatCount="indefinite"/>
  </circle>

  <!-- Bottom glow line -->
  <line x1="70" y1="397" x2="1130" y2="397"
        stroke="url(#accent)"
        stroke-opacity="0.65"/>

</svg>
