    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#CBD5E1" stroke-width="1" opacity="0.45"/>
    </pattern>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#64748B" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="430" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="430" rx="22" fill="url(#grid)"/>

  <!-- Decorative glow -->
  <circle cx="1030" cy="70" r="150" fill="#8B5CF6" opacity="0.07"/>
  <circle cx="180" cy="390" r="150" fill="#06B6D4" opacity="0.06"/>

  <!-- Main container -->
  <rect x="28" y="28" width="1144" height="374" rx="18"
        fill="#FFFFFF" fill-opacity="0.78"
        stroke="#CBD5E1"
