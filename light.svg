<svg width="1200" height="430" viewBox="0 0 1200 430" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="0.55" stop-color="#EEF2FF"/>
      <stop offset="1" stop-color="#F0FDFA"/>
    </linearGradient>

    <linearGradient id="accent" x1="180" y1="80" x2="1080" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0891B2"/>
      <stop offset="1" stop-color="#7C3AED"/>
